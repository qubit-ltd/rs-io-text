[package]
name = "qubit-io-text"
version = "0.5.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-io-text"
description = "Synchronous and asynchronous text I/O traits and charset adapters for Rust"
homepage = "https://github.com/qubit-ltd/rs-io-text"
documentation = "https://docs.rs/qubit-io-text"
readme = "README.md"
keywords = ["text", "io", "unicode", "encoding", "qubit"]
categories = ["encoding", "rust-patterns"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
]

[lib]
name = "qubit_io_text"
doctest = true

[dependencies]
qubit-utils = "0.3"
qubit-io = "0.16"
qubit-codec = { version = "0.14", features = ["io"] }
qubit-codec-text = "0.6"

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "string_adapters"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
