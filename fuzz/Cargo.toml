[package]
name = "qubit-io-text-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[lib]
doctest = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "^0.4"
qubit-io = "0.19"
qubit-codec = { version = "0.17", features = ["io"] }
qubit-codec-text = { path = "../../rs-codec-text", version = "0.9" }
qubit-io-text = { path = ".." }

[[bin]]
name = "charset_stream"
path = "fuzz_targets/charset_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "async_charset_state"
path = "fuzz_targets/async_charset_state.rs"
test = false
doc = false
bench = false
