[package]
name = "qubit-io-text-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
qubit-codec = { version = "0.16", path = "../../rs-codec", features = ["io"] }
qubit-codec-text = { version = "0.7", path = "../../rs-codec-text" }
qubit-io-text = { path = ".." }

[[bin]]
name = "charset_stream"
path = "fuzz_targets/charset_stream.rs"
test = false
doc = false
bench = false
